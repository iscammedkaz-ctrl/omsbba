# Cloudflare Pages - projet omsbeb (https://omsbeb.pages.dev)
name = "omsbeb"
pages_build_output_dir = "."
compatibility_date = "2025-01-01"

# D1 Free - source of truth (replaces Workers KV BEB)
[[d1_databases]]
binding = "DB"
database_name = "omsbeb"
database_id = "a53a4818-977d-4cc3-b62e-97f19d0b43bd"
migrations_dir = "migrations"

